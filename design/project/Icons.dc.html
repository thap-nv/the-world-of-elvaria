<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Elvaria — Bộ icon</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./elvaria.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Grenze+Gotisch:wght@400;500;600&amp;family=Cinzel:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#D4A454}a:hover{color:#EEE4CF}
</style>
</helmet>
<div class="elv" data-theme="night" style="width: 1440px; height: 1240px; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--elv-border); padding-bottom: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span class="elv-label">Elvaria · design system v0.2</span>
      <h1 class="elv-h1" style="font-size: 32px">Bộ icon đơn sắc</h1>
      <span class="elv-muted elv-body">Lưới 16×16, nét 1.5px, đầu nét tròn, không fill. Giao dạng SVG inline (<span class="elv-mono">.elv-ic</span>), màu theo <span class="elv-mono">currentColor</span>; cỡ 12 / 16 / 20 / 24. Tông hai: nét phụ dùng <span class="elv-mono">.t2</span> (55% đục).</span>
    </div>
    <div style="display: flex; gap: 16px; align-items: center" class="elv-muted elv-small">
      <span>Thử ở 16px:</span>
      <span style="display: inline-flex; gap: 8px; color: var(--elv-ink)"><sc-for list="{{sample}}" as="i" hint-placeholder-count="6"><svg class="elv-ic" viewBox="0 0 16 16" aria-hidden="true"><path d="{{i.d}}"></path></svg></sc-for></span>
      <span>12px:</span>
      <span style="display: inline-flex; gap: 6px; color: var(--elv-ink-2)"><sc-for list="{{sample}}" as="i" hint-placeholder-count="6"><svg class="elv-ic elv-ic--12" viewBox="0 0 16 16" aria-hidden="true"><path d="{{i.d}}"></path></svg></sc-for></span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 40px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span class="elv-h3">{{g.title}}</span>
          <span class="elv-mono elv-dim" style="font-size: 10px">{{g.prefix}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{g.items}}" as="i" hint-placeholder-count="6">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; border: 1px solid var(--elv-border); border-radius: 6px; background: var(--elv-surface)">
              <svg class="elv-ic elv-ic--24" viewBox="0 0 16 16" role="img" aria-label="{{i.label}}" style="color: {{i.color}}"><path d="{{i.d}}"></path></svg>
              <span class="elv-small" style="text-align: center; line-height: 1.2">{{i.label}}</span>
              <span class="elv-mono elv-dim" style="font-size: 9px">{{i.id}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

</script>
</body>
</html>
