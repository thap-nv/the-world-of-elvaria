<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Elvaria — HUD 2560×1600</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./elvaria.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Grenze+Gotisch:wght@400;500;600&amp;family=Cinzel:wght@600;700&amp;display=swap">
<style>body{margin:0} a{color:#D4A454}a:hover{color:#EEE4CF}</style>
</helmet>
<div class="elv" data-theme="night" style="width: 2560px; height: 1600px; overflow: hidden; position: relative">
  <dc-import name="Hud" theme="night" scene="default" w="{{ 2560 }}" h="{{ 1600 }}" hint-size="2560px,1600px"></dc-import>
  <div class="elv-tooltip" style="position: absolute; left: 50%; top: 64px; transform: translateX(-50%); max-width: 640px; text-align: center">Màn lớn ở tỉ lệ 100%: giao diện 2D giữ nguyên px (thanh trên 48, dock 380/240, chữ 11–24), phần dư dồn hết cho bản đồ 3D. Ở 150% Windows (2560×1600 → 1707×1067 hiệu dụng) bố cục 1440 áp dụng y nguyên.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2560,"height":1600}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
