name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, typecheck, unit, boundaries, drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm boundaries
      # --check also fails on a generated file that was never committed, which git diff cannot see:
      # the regenerated file would be untracked (implementation-plan §7).
      - name: docs/schemas is generated from zod (P0-03)
        run: pnpm schemas --check && pnpm schemas && git diff --exit-code docs/schemas
      - name: Generated docs are up to date (P0-07)
        run: pnpm docs:gen --check && pnpm docs:gen && git diff --exit-code docs/
      - run: pnpm docs:check
      - run: pnpm i18n:check
      - run: pnpm audit --prod --audit-level high

  platform:
    name: Typecheck and unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # P0-10 adds the sandbox replay smoke run here (implementation-plan §7).
